name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          ./build.sh
          mkdir -p dist/ZapretAuto
          cp ZapretAuto.exe README.md dist/ZapretAuto/
          git archive --format=tar HEAD | tar -x -C dist/ZapretAuto
          (cd dist && zip -qr ZapretAuto.zip ZapretAuto)
          sha256sum ZapretAuto.exe dist/ZapretAuto.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$TAG" ZapretAuto.exe dist/ZapretAuto.zip \
            --target "$GITHUB_SHA" \
            --title "ZapretAuto $TAG" \
            --notes-file .github/release-notes.md
