name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (можно не заполнять — номер увеличится сам)"
        required: false
        default: ""
  push:
    tags: ["v*"]
    # Любое изменение кода в main сразу выпускается новым релизом, а установленные
    # программы находят его и обновляются сами. Правки README и т.п. релиз не выпускают.
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "winres/**"
      - "build.sh"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"

permissions:
  contents: write

# Несколько пушей подряд выпускаются по очереди, чтобы номера версий не пересекались.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужна история и теги — для списка изменений

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Pick version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT" ]; then
            TAG="$INPUT"
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          else
            LAST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -z "$LAST" ]; then
              TAG="v1.0.0"
            else
              IFS=. read -r MA MI PA <<< "${LAST#v}"
              TAG="v$MA.$MI.$((PA + 1))"
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Релиз $TAG уже есть. Оставьте поле версии пустым — номер выберется сам."
            exit 1
          fi
          echo "Версия: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install go-winres
        run: go install github.com/tc-hib/go-winres@v0.3.3 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test
        run: go test ./...

      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          ./build.sh
          mkdir -p dist/ZapretAuto
          cp ZapretAuto.exe README.md dist/ZapretAuto/
          git archive --format=tar HEAD | tar -x -C dist/ZapretAuto
          (cd dist && zip -qr ZapretAuto.zip ZapretAuto)
          sha256sum ZapretAuto.exe dist/ZapretAuto.zip

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Раздел этой версии из CHANGELOG.md («## v1.0.10 · …»), иначе — заголовки коммитов с прошлого релиза.
          NOTES=$(awk -v t="$TAG" '/^## /{if(f)exit; f=($2==t); next} f' CHANGELOG.md)
          if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
            PREV=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
              NOTES=$(git log --no-merges --pretty='- %s' "$PREV..HEAD")
            fi
          fi
          {
            cat .github/release-notes.md
            if [ -n "$NOTES" ]; then
              printf '\n## Что нового в %s\n\n' "$TAG"
              echo "$NOTES"
            fi
          } > dist/notes.md
          cat dist/notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" ZapretAuto.exe dist/ZapretAuto.zip \
            --target "$GITHUB_SHA" \
            --title "ZapretAuto $TAG" \
            --notes-file dist/notes.md
