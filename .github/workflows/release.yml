name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия (можно не заполнять — номер увеличится сам)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Pick version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          elif [ -n "$INPUT" ]; then
            TAG="$INPUT"
            case "$TAG" in v*) ;; *) TAG="v$TAG" ;; esac
          else
            LAST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -z "$LAST" ]; then
              TAG="v1.0.0"
            else
              IFS=. read -r MA MI PA <<< "${LAST#v}"
              TAG="v$MA.$MI.$((PA + 1))"
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Релиз $TAG уже есть. Оставьте поле версии пустым — номер выберется сам."
            exit 1
          fi
          echo "Версия: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          ./build.sh
          mkdir -p dist/ZapretAuto
          cp ZapretAuto.exe README.md dist/ZapretAuto/
          git archive --format=tar HEAD | tar -x -C dist/ZapretAuto
          (cd dist && zip -qr ZapretAuto.zip ZapretAuto)
          sha256sum ZapretAuto.exe dist/ZapretAuto.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" ZapretAuto.exe dist/ZapretAuto.zip \
            --target "$GITHUB_SHA" \
            --title "ZapretAuto $TAG" \
            --notes-file .github/release-notes.md
